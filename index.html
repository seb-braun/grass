<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grass demo</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        background: #10251b;
        color: #f0fdf4;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 4rem));
        padding: 2rem;
        text-align: center;
      }

      h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        margin-bottom: 0.5rem;
      }

      p {
        line-height: 1.6;
      }

      .count {
        font-size: 2rem;
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .garden {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: center;
        gap: 1rem;
        min-height: 6rem;
        margin-top: 1.5rem;
        padding: 1.5rem;
        border: 2px dashed #86efac;
        border-radius: 0.75rem;
        background: #173d29;
      }

      .garden:empty::before {
        content: "Your garden is empty. Plant a seedling to get started!";
        align-self: center;
        line-height: 1.6;
      }

      .storage-message {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border: 2px solid #fcd34d;
        border-radius: 0.5rem;
      }

      .garden img {
        max-width: 100%;
        height: auto;
      }

      button {
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        border: 2px solid #86efac;
        border-radius: 0.5rem;
        background: #86efac;
        color: #10251b;
        cursor: pointer;
      }

      button:hover {
        background: #bbf7d0;
      }

      button:focus-visible {
        outline: 3px solid #f0fdf4;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Welcome to grass</h1>
      <p>A tiny playground for GitHub CLI demonstrations. Grow your own virtual garden!</p>
      <p>Each click plants a random leafy plant, cactus, sunflower, or succulent.</p>
      <p class="count" role="status" aria-live="polite" aria-atomic="true">
        Plants planted: <span id="count">0</span>
      </p>
      <div class="actions">
        <button id="plant" type="button">Plant a seedling</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <div id="garden" class="garden" role="group" aria-label="Your garden"></div>
      <p id="storage-message" class="storage-message" role="alert" hidden></p>
      <noscript><p>Enable JavaScript to plant seedlings in the garden.</p></noscript>
      <p>For demonstration purposes only. Not intended for production use.</p>
    </main>
    <script>
      const count = document.getElementById("count");
      const garden = document.getElementById("garden");
      const plants = [
        { src: "plant.svg", alt: "A leafy green plant in a terracotta pot" },
        { src: "cactus.svg", alt: "A green cactus in a terracotta pot" },
        { src: "sunflower.svg", alt: "A yellow sunflower in a terracotta pot" },
        { src: "succulent.svg", alt: "A rosette succulent in a terracotta pot" },
      ];

      const storageKey = "grass-demo:garden";
      const storageVersion = 1;
      const storageMessage = document.getElementById("storage-message");
      const varieties = new Map(plants.map((plant) => [plant.src, plant]));
      let plantedVarieties = [];

      function showStorageMessage(message) {
        storageMessage.textContent = message;
        storageMessage.hidden = false;
      }

      function addPlant(variety) {
        const plant = document.createElement("img");
        plant.src = variety.src;
        plant.alt = variety.alt;
        plant.width = 80;
        plant.height = 96;
        garden.appendChild(plant);
      }

      function render() {
        garden.replaceChildren();
        plantedVarieties.forEach((src) => addPlant(varieties.get(src)));
        count.textContent = String(plantedVarieties.length);
      }

      function saveGarden() {
        try {
          if (plantedVarieties.length === 0) {
            localStorage.removeItem(storageKey);
          } else {
            localStorage.setItem(storageKey, JSON.stringify({ version: storageVersion, plants: plantedVarieties }));
          }
        } catch {
          showStorageMessage("Your garden can't be saved in this browser, so it will be lost when you reload the page.");
        }
      }

      function loadGarden() {
        let saved;
        try {
          saved = localStorage.getItem(storageKey);
        } catch {
          showStorageMessage("Your garden can't be saved in this browser, so it will be lost when you reload the page.");
          return;
        }
        if (saved === null) return;

        try {
          const data = JSON.parse(saved);
          if (
            data?.version !== storageVersion ||
            !Array.isArray(data.plants) ||
            !data.plants.every((src) => typeof src === "string" && varieties.has(src))
          ) {
            throw new Error("Invalid saved garden");
          }
          plantedVarieties = data.plants;
        } catch {
          showStorageMessage("Your saved garden couldn't be restored, so you're starting with an empty garden.");
        }
      }

      document.getElementById("plant").addEventListener("click", () => {
        const variety = plants[Math.floor(Math.random() * plants.length)];
        plantedVarieties.push(variety.src);
        addPlant(variety);
        count.textContent = String(plantedVarieties.length);
        saveGarden();
      });

      document.getElementById("reset").addEventListener("click", () => {
        plantedVarieties = [];
        render();
        saveGarden();
      });

      loadGarden();
      render();
    </script>
  </body>
</html>
