<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>grass demo</title>
    <style>
      :root {
        --bg: #10251b;
        --text: #f0fdf4;
        --garden-bg: #173d29;
        --garden-border: #86efac;
        --button-bg: #86efac;
        --button-border: #86efac;
        --button-text: #10251b;
        --button-hover-bg: #bbf7d0;
        --focus: #f0fdf4;
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      :root[data-theme="light"] {
        --bg: #f0fdf4;
        --text: #10251b;
        --garden-bg: #dcfce7;
        --garden-border: #15803d;
        --button-bg: #166534;
        --button-border: #166534;
        --button-text: #f0fdf4;
        --button-hover-bg: #14532d;
        --focus: #10251b;
        color-scheme: light;
      }

      .theme-toggle-wrap {
        display: flex;
        justify-content: flex-end;
      }

      .theme-toggle {
        padding: 0.5rem 1rem;
        font-size: 0.9rem;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(32rem, calc(100% - 4rem));
        padding: 2rem;
        text-align: center;
      }

      h1 {
        font-size: clamp(2rem, 8vw, 4rem);
        margin-bottom: 0.5rem;
      }

      p {
        line-height: 1.6;
      }

      .count {
        font-size: 2rem;
        font-weight: 700;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.75rem;
      }

      .garden {
        display: flex;
        flex-wrap: wrap;
        align-items: end;
        justify-content: center;
        gap: 1rem;
        min-height: 6rem;
        margin-top: 1.5rem;
        padding: 1.5rem;
        border: 2px dashed var(--garden-border);
        border-radius: 0.75rem;
        background: var(--garden-bg);
      }

      .garden:empty::before {
        content: "Your garden is empty. Plant a seedling to get started!";
        align-self: center;
        line-height: 1.6;
      }

      .garden img {
        max-width: 100%;
        height: auto;
      }

      button {
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        border: 2px solid var(--button-border);
        border-radius: 0.5rem;
        background: var(--button-bg);
        color: var(--button-text);
        cursor: pointer;
      }

      button:hover {
        background: var(--button-hover-bg);
      }

      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="theme-toggle-wrap">
        <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">Light theme</button>
      </div>
      <h1>Welcome to grass</h1>
      <p>A tiny playground for GitHub CLI demonstrations. Grow your own virtual garden!</p>
      <p>Each click plants a random leafy plant, cactus, sunflower, or succulent.</p>
      <p class="count" role="status" aria-live="polite" aria-atomic="true">
        Plants planted: <span id="count">0</span>
      </p>
      <div class="actions">
        <button id="plant" type="button">Plant a seedling</button>
        <button id="reset" type="button">Reset</button>
      </div>
      <div id="garden" class="garden" role="group" aria-label="Your garden"></div>
      <noscript><p>Enable JavaScript to plant seedlings in the garden.</p></noscript>
      <p>For demonstration purposes only. Not intended for production use.</p>
    </main>
    <script>
      const themeToggle = document.getElementById("theme-toggle");
      themeToggle.addEventListener("click", () => {
        const light = themeToggle.getAttribute("aria-pressed") !== "true";
        document.documentElement.dataset.theme = light ? "light" : "dark";
        themeToggle.setAttribute("aria-pressed", String(light));
      });

      const count = document.getElementById("count");
      const garden = document.getElementById("garden");
      const plants = [
        { src: "plant.svg", alt: "A leafy green plant in a terracotta pot" },
        { src: "cactus.svg", alt: "A green cactus in a terracotta pot" },
        { src: "sunflower.svg", alt: "A yellow sunflower in a terracotta pot" },
        { src: "succulent.svg", alt: "A rosette succulent in a terracotta pot" },
      ];

      document.getElementById("plant").addEventListener("click", () => {
        const variety = plants[Math.floor(Math.random() * plants.length)];
        const plant = document.createElement("img");
        plant.src = variety.src;
        plant.alt = variety.alt;
        plant.width = 80;
        plant.height = 96;
        garden.appendChild(plant);
        count.textContent = String(garden.childElementCount);
      });

      document.getElementById("reset").addEventListener("click", () => {
        garden.replaceChildren();
        count.textContent = "0";
      });
    </script>
  </body>
</html>
